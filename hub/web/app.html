<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · Epsilon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <nav class="nav" aria-label="Main">
    <a class="wordmark" href="/">Epsilon</a>
    <a href="/app" aria-current="page">Messages</a>
    <a href="/sounds">Sounds</a>
    <a href="/setup">Set up</a>
  </nav>

  <main class="page page-narrow">
    <header class="app-head">
      <h1>Messages</h1>
      <p class="status" id="live-status" data-live="false" role="status"><span class="dot" aria-hidden="true"></span><span id="live-label">Connecting…</span></p>
    </header>

    <section class="insight-box" aria-label="Today">
      <button class="btn" type="button" id="insight-btn">What does today look like?</button>
      <div class="insight" id="insight" hidden aria-live="polite">
        <p id="insight-summary"></p>
        <p id="insight-tip"></p>
        <p class="quiet insight-by" id="insight-by"></p>
      </div>
    </section>

    <button class="btn btn-primary" type="button" id="safe" hidden>I am with them now</button>

    <div class="empty" id="feed-empty">
      <p class="msg-text">No messages yet.</p>
      <p class="quiet">When your child sends a word, it appears here. You can try one from <a href="/setup">Set up</a>.</p>
    </div>
    <ol class="thread" id="feed" aria-live="polite" aria-label="Messages, oldest first"></ol>
  </main>
</body>
</html>
